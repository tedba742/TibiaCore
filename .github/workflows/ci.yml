name: CI

on:
  push:
    branches: [ main, tedba-main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure (tests only)
        working-directory: compiler
        run: cmake --preset coverage

      - name: Build tests
        working-directory: compiler
        run: cmake --build --preset coverage-build

      - name: Run tests
        working-directory: compiler
        run: ctest --preset coverage-test --output-on-failure
